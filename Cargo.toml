[package]
name = "localsearch"
version = "0.1.0"
edition = "2021"

[workspace]
members = [".", "extractor-xpc"]

[dependencies]
roaring = "0.10"
lz4_flex = "0.11"
zstd = "0.13"
crossbeam = "0.8"
rayon = "1.10"
memmap2 = "0.9"
rusqlite = { version = "0.31", features = ["bundled"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
unicode-normalization = "0.1"
rust-stemmers = "1.2"
log = "0.4"
env_logger = "0.11"
thiserror = "1.0"
anyhow = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
notify = "6.1"

[dev-dependencies]
tempfile = "3"
walkdir = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
