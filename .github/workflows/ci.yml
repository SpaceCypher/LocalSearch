name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The engine uses FSEvents, PDFKit and the AppKit document importers,
    # so it is built and tested on macOS only.
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Rust tests (engine, FFI, extractor helper and its sandbox)
        run: cargo test --workspace --locked

      - name: Benchmark and example targets still build
        run: cargo build --release --locked --all-targets

      - name: Swift tests
        working-directory: frontend
        run: swift test

      - name: Package the app (ad-hoc signed)
        run: scripts/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: LocalSearch-unsigned
          path: dist/*.zip
          if-no-files-found: error
